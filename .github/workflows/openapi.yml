name: OpenAPI contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Regenerate OpenAPI contract
        run: php artisan openapi:generate

      - name: Reject contract drift
        run: git diff --exit-code -- openapi.yaml

      - name: Validate OpenAPI 3.1 document
        run: npx --yes @redocly/cli@2.49.0 lint openapi.yaml
