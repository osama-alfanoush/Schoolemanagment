name: Mobile

on:
  push:
    paths:
      - "school-mobile/**"
      - "laravel-api/openapi.yaml"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "school-mobile/**"
      - "laravel-api/openapi.yaml"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-mobile

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - run: flutter build apk --flavor dev

  generated-drift:
    # Regenerates lib/generated/ from the committed contract and fails if the
    # result differs from what is checked in. Keeps the client honest without
    # anyone having to remember to regenerate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-mobile

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Regenerate the API client
        run: dart run tool/openapi/generate.dart

      - name: Fail if lib/generated/ is out of date
        run: |
          git add --intent-to-add lib/generated
          if ! git diff --exit-code -- lib/generated; then
            echo "::error::lib/generated/ is out of date with laravel-api/openapi.yaml."
            echo "Run 'dart run tool/openapi/generate.dart' in school-mobile/ and commit the result."
            exit 1
          fi
          echo "lib/generated/ matches the committed contract."
