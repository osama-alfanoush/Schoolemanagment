include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Machine-generated OpenAPI client: not held to the hand-written lint rules.
    # Still type-checked whenever compiled (see test/generated_client_test.dart).
    - lib/generated/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    use_named_constants: true
