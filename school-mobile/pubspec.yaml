name: school_mobile
description: "Android client for School Suite."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  built_collection: 5.1.1
  built_value: 8.12.7
  # Certificate pinning hashes an SPKI. Already in the lock file as a
  # transitive dependency; named here because a direct import must be a
  # direct dependency.
  crypto: 3.0.6
  dio: 5.11.0
  drift: 2.34.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 10.0.0
  go_router: 18.0.0
  hijri: 3.0.1
  intl: 0.20.3
  local_auth: 3.0.2
  one_of: 1.5.0
  one_of_serializer: 1.5.0
  path_provider: 2.1.6
  sqlite3: 3.5.2
  # Only for "call this student's guardian". Placing a call is a platform
  # intent; there is no way to do it from Dart. Wrapped behind GuardianDialer
  # so every screen that offers it stays testable.
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.0
  built_value_generator: 8.12.7
  drift_dev: 2.34.5
  flutter_lints: 6.0.0
  openapi_generator_cli: 7.0.0

# Selects the SQLCipher build of package:sqlite3 for every platform, including
# the host used by `flutter test`. This is what actually provides `PRAGMA key`;
# see lib/core/db/encrypted_database.dart.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
