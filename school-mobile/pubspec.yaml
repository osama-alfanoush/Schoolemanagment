name: school_mobile
description: "Android client for School Suite."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: 5.11.0
  drift: 2.34.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 10.0.0
  go_router: 18.0.0
  intl: 0.20.3
  local_auth: 3.0.2
  path_provider: 2.1.6
  sqlite3_flutter_libs: 0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.0
  drift_dev: 2.34.5

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
