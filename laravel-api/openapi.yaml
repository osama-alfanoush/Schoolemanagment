                  type:
                    - string
                    - 'null'
                  maxLength: 255.0
              required:
                - code
                - device_id
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  must_change_password:
                    type: boolean
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      role:
                        type: string
                      school_id:
                        type: integer
                    required:
                      - id
                      - name
                      - role
                      - school_id
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - must_change_password
                  - user
        403:
          description: ''
          content:
