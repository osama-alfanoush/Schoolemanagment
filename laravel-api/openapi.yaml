                            explainable:
                              type: string
                          required:
                            - id
                            - date
                            - status
                            - subject
                            - note
                            - explanation
                            - explained_at
                            - explainable
                    required:
                      - student_user_id
                      - from
                      - to
                      - recorded_days
                      - absent_days
                      - late_days
                      - present_percent
                      - days
                required:
                  - data
