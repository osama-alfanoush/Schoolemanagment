            type: string
        -
          name: date_to
          in: query
          schema:
            type: string
        -
          name: search
          in: query
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    minimum: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JournalBatch'
                  first_page_url:
                    type:
                      - string
                      - 'null'
                  from:
                    type:
                      - integer
                      - 'null'
                    minimum: 1
                  last_page_url:
                    type:
                      - string
                      - 'null'
                  last_page:
                    type: integer
                    minimum: 1
                  links:
                    type: array
                    description: 'Generated paginator links.'
                    items:
                      type: object
                      properties:
                        url:
                          type:
                            - string
                            - 'null'
                        label:
                          type: string
                        active:
                          type: boolean
                      required:
                        - url
                        - label
                        - active
                  next_page_url:
                    type:
                      - string
                      - 'null'
                  path:
                    type:
                      - string
                      - 'null'
                    description: 'Base path for paginator generated URLs.'
                  per_page:
                    type: integer
                    description: 'Number of items shown per page.'
                    minimum: 0
                  prev_page_url:
                    type:
                      - string
                      - 'null'
                  to:
                    type:
                      - integer
                      - 'null'
                    description: 'Number of the last item in the slice.'
                    minimum: 1
                  total:
                    type: integer
                    description: 'Total number of items being paginated.'
                    minimum: 0
                required:
                  - current_page
                  - data
                  - first_page_url
                  - from
                  - last_page_url
                  - last_page
                  - links
                  - next_page_url
                  - path
                  - per_page
                  - prev_page_url
                  - to
                  - total
