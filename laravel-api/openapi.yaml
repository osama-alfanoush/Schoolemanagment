  '/mobile/v1/parent/pay/{installmentId}/intent':
    post:
      operationId: parentFinance.payIntent
      description: |-
        `Idempotency-Key` is required. A parent on a bad connection taps pay,
        sees nothing, and taps again; the phone may retry on its own too. Without
        the key those are separate payments.
      summary: 'Creates the intent to pay one installment'
      tags:
        - ParentFinance
      parameters:
        -
          name: installmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  type: string
                  format: uuid
              required:
                - idempotency_key
      responses:
        200:
          description: |-
            201 the first time, 200 for every replay of the same key. Both carry
            the same body, so a client that missed the first answer is not told
            anything different by the retry that reached it.
          content:
            application/json:
              schema:
                type: string
        422:
          $ref: '#/components/responses/ValidationException'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
