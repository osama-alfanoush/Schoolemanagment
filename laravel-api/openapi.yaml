  /mobile/v1/sync/delta:
    get:
      operationId: sync.delta
      description: |-
        Returns everything that changed for the authenticated user since
        `since`, plus tombstones for what was deleted, plus the cursor to
        resume from. Omit `since` for a first full pull.

        The response is scoped entirely from the token: a parent sees only their
        own children's records, a teacher only their assigned classes, a student
        only themselves. `types` selects from what the role already allows and
        can only narrow that set, never widen it.
      summary: 'Mobile delta sync'
      tags:
        - Sync
      parameters:
        -
          name: since
          in: query
          schema:
            type:
              - string
              - 'null'
            maxLength: 4096.0
        -
          name: types
          in: query
          schema:
            type:
              - string
              - 'null'
            maxLength: 512.0
        -
          name: limit
          in: query
          schema:
            type:
              - integer
              - 'null'
            minimum: 1.0
            maximum: 500.0
      responses:
        200:
          description: '`DeltaPageResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeltaPageResource'
                required:
                  - data
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: 'This role has no mobile sync feed.'
                  errors:
                    type: string
                required:
                  - message
                  - errors
        401:
          $ref: '#/components/responses/AuthenticationException'
