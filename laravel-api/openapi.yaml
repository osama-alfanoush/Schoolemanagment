openapi: 3.1.0
info:
  title: 'School Management Suite'
  version: 1.0.0
  description: 'Canonical contract for the School Management Suite web and mobile clients.'
servers:
  -
    url: /api
    description: 'Relative API base path'
security:
  -
    http: []
paths:
  /healthz:
    get:
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
      security: []
      summary: 'GET /healthz'
  '/auth/password/reset/{token}':
    get:
      operationId: password.reset
      parameters:
        -
          name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: 'Use POST /api/auth/reset-password with this token, your email, and the new password.'
                  token:
                    type: string
                required:
                  - message
                  - token
      security: []
      summary: 'Password Reset'
  /accounting/journal-batches:
