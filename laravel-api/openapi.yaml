  '/mobile/v1/teacher/gradebook/{classId}/{subjectId}':
    get:
      operationId: teacher.gradebook
      description: |-
        Carries the gradebook's workflow state and every score's version, so the
        client can show a locked sheet as locked and a stale edit as stale
        rather than discovering either at submission time.
      summary: "One class's mark sheet for one subject"
      tags:
        - Teacher
      parameters:
        -
          name: classId
          in: path
          required: true
          schema:
            type: integer
        -
          name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        304:
          description: ''
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      class_room_id:
                        type: integer
                      subject_id:
                        type: integer
                      gradebook:
                        type:
                          - object
                          - 'null'
                        properties:
                          id:
                            type: integer
                          state:
                            type: string
                          editable:
                            type: boolean
                            description: |-
                              The one thing the client must not work out for itself: the
                              reopen window is a timestamp, and a client clock that is a
                              day out would offer an editable sheet the server refuses.
                          reopened_until:
                            type:
                              - string
                              - 'null'
                        required:
                          - id
                          - state
                          - editable
                          - reopened_until
                      components:
                        type: array
                        items:
                          type: string
                      students:
                        type: array
                        items:
                          type: object
                          properties:
                            student_user_id:
                              type: integer
                            name:
                              type: string
                            grades:
                              anyOf:
                                -
                                  type: string
                                -
                                  type: array
                                  items:
                                    type: string
                                  minItems: 0
                                  maxItems: 0
                          required:
                            - student_user_id
                            - name
                            - grades
                    required:
                      - class_room_id
                      - subject_id
                      - gradebook
                      - components
                      - students
                required:
                  - data
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: 'You are not assigned to this class.'
                  errors:
                    type: string
                required:
                  - message
                  - errors
        401:
          $ref: '#/components/responses/AuthenticationException'
  /mobile/v1/teacher/attendance/batch:
    post:
      operationId: teacher.attendanceBatch
      description: |-
        `Idempotency-Key` is required. This is the endpoint an offline phone
        drains into, so the same batch will be sent again after any timeout, and
        the unique index on the key is what makes the second send a no-op rather
        than a second submission.
      summary: "A whole class's attendance in one write"
      tags:
        - Teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  type: string
                  format: uuid
                class_room_id:
                  type: integer
                subject_id:
                  type:
                    - integer
                    - 'null'
                course_section_id:
                  type:
                    - integer
                    - 'null'
                date:
                  type: string
                  format: date-time
                records:
                  type: array
                  items:
                    type: object
                    properties:
                      student_user_id:
                        type: integer
                      status:
                        type: string
                        enum:
                          - present
                          - absent
                          - late
                          - excused
                      note:
                        type:
                          - string
                          - 'null'
                        maxLength: 500.0
                    required:
                      - student_user_id
                      - status
                  minItems: 1.0
              required:
                - idempotency_key
                - class_room_id
                - date
                - records
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      batch_id:
                        type: integer
                      class_room_id:
                        type: integer
                      date:
                        type: string
                      record_count:
                        type: integer
                      committed_at:
                        type:
                          - string
                          - 'null'
                      attendance_window:
                        type: object
                        properties:
                          open:
                            type: boolean
                          hours:
                            type: integer
                          closes_at:
                            type: string
                          reason:
                            type:
                              - string
                              - 'null'
                        required:
                          - open
                          - hours
                          - closes_at
                          - reason
                    required:
                      - batch_id
                      - class_room_id
                      - date
                      - record_count
                      - committed_at
                      - attendance_window
                required:
                  - data
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: 'You are not assigned to this class.'
                  errors:
                    type: string
                required:
                  - message
                  - errors
        401:
          $ref: '#/components/responses/AuthenticationException'
  /mobile/v1/teacher/grades/batch:
    post:
      operationId: teacher.gradesBatch
      description: |-
        All-or-nothing, and idempotent on the key. A partially applied batch is
        unrecoverable for an offline client: it cannot tell which half landed.
      summary: 'A column of marks in one write'
      tags:
        - Teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  type: string
                  format: uuid
                class_room_id:
                  type: integer
                subject_id:
                  type: integer
                grades:
                  type: array
                  items:
                    type: object
                    properties:
                      grade_component_id:
                        type: integer
                      student_user_id:
                        type: integer
                      score:
                        type: number
                      version:
                        type:
                          - integer
                          - 'null'
                      reason:
                        type:
                          - string
                          - 'null'
                        maxLength: 255.0
                    required:
                      - grade_component_id
                      - student_user_id
                      - score
                  minItems: 1.0
              required:
                - idempotency_key
                - class_room_id
                - subject_id
                - grades
      responses:
        200:
          description: |-
            A closed gradebook or a stale version. Both are states the
            teacher can act on, so the reason travels to the client.
          content:
            application/json:
              schema:
                anyOf:
                  -
                    type: object
                    properties:
                      data:
                        type: string
                    required:
                      - data
                  -
                    type: string
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: 'You are not assigned to this class.'
                  errors:
                    type: string
                required:
                  - message
                  - errors
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
