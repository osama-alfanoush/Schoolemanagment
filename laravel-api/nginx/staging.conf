upstream staging_api {
    least_conn;
    server api1:9000 max_fails=1 fail_timeout=10s;
    server api2:9000 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

# Rate limiting is sized for a SCHOOL BEHIND ONE PUBLIC IP, not for one person.
#
# Schools NAT every device through a single address, so a per-IP limit applies
# to the whole site at once. The previous values (120 req/min for the API,
# 5 login attempts/min) meant the sixth teacher to sign in during morning
# registration received a 429 and the portal was unusable from about ten
# concurrent users — measured: 2 190 of 2 857 requests rejected at 25 users.
#
# This zone is a crude flood backstop only. The real credential-stuffing control
# is in the application and is keyed by ACCOUNT, not by address:
# 8 attempts/minute per normalised email, plus per-IP and global ceilings
# (AppServiceProvider::boot). NAT cannot dilute that one, so raising the edge
# limit does not weaken it.
#
# If this nginx sits behind a cloud load balancer or CDN, configure
# set_real_ip_from/real_ip_header for that hop as well — otherwise every request
# arrives from the balancer and the per-IP limit again applies to everyone at
# once.
limit_req_zone $binary_remote_addr zone=staging_login:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=staging_api_limit:10m rate=6000r/m;

server {
    listen 80;
    server_name _;
    limit_req_status 429;
    root /var/www/public;
    index index.php;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 20M;

    location = /api/auth/login {
        limit_req zone=staging_login burst=60 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass staging_api;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_read_timeout 30;
    }

    # Public liveness probe. It MUST NOT share the /api/ rate-limit zone: the
    # limit is per client IP, and a platform health checker, an uptime monitor
    # and ordinary API traffic frequently arrive from the same address. When
    # healthz gets 429ed the orchestrator concludes the service is down and
    # restarts a perfectly healthy container. The endpoint returns a constant
    # JSON literal, so it is not a meaningful amplification target.
    location = /api/healthz {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass staging_api;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 10;
    }

    # PHP-FPM pool status, for capacity measurement only. Restricted to the
    # compose network: it reports process counts and queue depth, which is
    # operational detail nobody outside should see.
    location = /fpm-status {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME "";
        fastcgi_pass staging_api;
    }

    location /api/ {
        limit_req zone=staging_api_limit burst=300 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass staging_api;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_read_timeout 60;
    }

    location ~ \.map$ {
        deny all;
        return 404;
    }

    location /assets/ {
        root /var/www/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }

    # nginx replaces inherited add_header directives once a location declares
    # its own, so the server-level security headers are restated here.
    location = /index.html {
        root /var/www/html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
