# Load-generation edge — NOT a deployable configuration.
#
# staging.conf and prod.conf rate limit /api/ per client IP. That is the right
# production control, but it makes a single-host load generator measure the
# limiter instead of the application: 50 virtual users all arrive from one
# address. This copy raises only the /api/ zone rate so k6 can measure what the
# PHP/Postgres/Redis tier actually sustains. Everything else is identical, so
# routing, headers and upstream behaviour stay representative.
#
# Never mount this in staging or production.

upstream staging_api {
    least_conn;
    server api1:9000 max_fails=1 fail_timeout=10s;
    server api2:9000 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=staging_login:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=staging_api_limit:10m rate=60000r/m;

server {
    listen 80;
    # see header: edge limits deliberately relaxed for measurement
    server_name _;
    limit_req_status 429;
    root /var/www/public;
    index index.php;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 20M;

    location = /api/auth/login {
        limit_req zone=staging_login burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass staging_api;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_read_timeout 30;
    }

    # Public liveness probe. It MUST NOT share the /api/ rate-limit zone: the
    # limit is per client IP, and a platform health checker, an uptime monitor
    # and ordinary API traffic frequently arrive from the same address. When
    # healthz gets 429ed the orchestrator concludes the service is down and
    # restarts a perfectly healthy container. The endpoint returns a constant
    # JSON literal, so it is not a meaningful amplification target.
    location = /api/healthz {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass staging_api;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 10;
    }

    location /api/ {
        limit_req zone=staging_api_limit burst=2000 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass staging_api;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_read_timeout 60;
    }

    location ~ \.map$ {
        deny all;
        return 404;
    }

    location /assets/ {
        root /var/www/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }

    # nginx replaces inherited add_header directives once a location declares
    # its own, so the server-level security headers are restated here.
    location = /index.html {
        root /var/www/html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
