upstream php_backend {
    least_conn;
    server api1:9000 max_fails=1 fail_timeout=10s;
    server api2:9000 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

# Rate limiting is sized for a SCHOOL BEHIND ONE PUBLIC IP, not for one person.
#
# Schools NAT every device through a single address, so a per-IP limit applies
# to the whole site at once. The previous values (120 req/min for the API,
# 5 login attempts/min) meant the sixth teacher to sign in during morning
# registration received a 429 and the portal was unusable from about ten
# concurrent users — measured: 2 190 of 2 857 requests rejected at 25 users.
#
# This zone is a crude flood backstop only. The real credential-stuffing control
# is in the application and is keyed by ACCOUNT, not by address:
# 8 attempts/minute per normalised email, plus per-IP and global ceilings
# (AppServiceProvider::boot). NAT cannot dilute that one, so raising the edge
# limit does not weaken it.
#
# If this nginx sits behind a cloud load balancer or CDN, configure
# set_real_ip_from/real_ip_header for that hop as well — otherwise every request
# arrives from the balancer and the per-IP limit again applies to everyone at
# once.
limit_req_zone $binary_remote_addr zone=login:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=6000r/m;

server {
    listen 80;
    server_name _;
    limit_req_status 429;

    root /var/www/public;
    index index.php;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS must be an HTTP header (cannot be set via <meta>); the SPA shell and
    # assets are served here, not through the Laravel SecurityHeaders middleware.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    client_max_body_size 20M;

    location = /api/auth/login {
        limit_req zone=login burst=60 nodelay;
        try_files $uri /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    # Public liveness probe. It MUST NOT share the /api/ rate-limit zone: the
    # limit is per client IP, and a platform health checker, an uptime monitor
    # and ordinary API traffic frequently arrive from the same address. When
    # healthz gets 429ed the orchestrator concludes the service is down and
    # restarts a perfectly healthy container. The endpoint returns a constant
    # JSON literal, so it is not a meaningful amplification target.
    location = /api/healthz {
        access_log off;
        try_files $uri /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_connect_timeout 2s;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 10;
    }

    location /api/ {
        limit_req zone=api burst=300 nodelay;
        try_files $uri /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # User uploads (profile photos, school logos) live on the shared storage
    # volume, mounted read-only from the API containers. Served directly so
    # /storage/... URLs resolve in production instead of 404ing.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        autoindex off;
        limit_except GET { deny all; }
        expires 7d;
        # nginx REPLACES inherited add_header directives as soon as a location
        # declares one of its own, so every server-level security header must be
        # repeated here. Without this, uploaded files were served with no
        # nosniff/frame protection at all.
        add_header Cache-Control "public";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Uploads are user-controlled bytes: never let the browser execute or
        # frame them, and never let a stored SVG/HTML run in this origin.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Never expose JS/CSS source maps to the public.
    location ~ \.map$ {
        deny all;
        return 404;
    }

    # Only Laravel's front controller may execute. This prevents a future
    # upload-validation mistake from turning a file under /storage into PHP.
    location = /index.php {
        fastcgi_pass php_backend;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # Content-hashed build assets are immutable — safe to cache for a year.
    location /assets/ {
        root /var/www/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback. The shell (index.html) must NOT be cached long-term or
    # clients keep loading stale JS references after a deploy.
    location / {
        root /var/www/html;
        # The server-level `index index.php` is inherited here, and there is no
        # index.php in the SPA root. Without this line a request for "/" matches
        # the `$uri/` arm of try_files, nginx looks for index.php in the
        # directory, fails, and returns 403 -- the /index.html fallback is never
        # reached. Deep links worked, so only the bare domain was broken: the
        # one URL every user types.
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell. Its own add_header for cache control used to wipe out every
    # inherited security header on the one document that most needs them, so all
    # of them are restated. The CSP here is the frontend's, not the API's.
    location = /index.html {
        root /var/www/html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location = /api/health {
        try_files $uri /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_connect_timeout 2s;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
