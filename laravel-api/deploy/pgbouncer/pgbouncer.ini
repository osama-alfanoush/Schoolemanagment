;; PgBouncer — connection pooling in front of PostgreSQL.
;;
;; Why this exists: php-fpm has no persistent connection pool. Every request
;; opens a PostgreSQL connection and closes it at the end, and a PostgreSQL
;; backend is a forked OS process. Under load that connection churn becomes the
;; dominant database cost — during the 500-VU load run PostgreSQL burned ~7.4 of
;; 16 CPU cores while serving only ~157 req/s of otherwise cheap queries
;; (10-24 statements, 15-26 ms of database time per request, 99.999% buffer
;; cache hit ratio).
;;
;; Raising max_connections is the wrong lever: it multiplies backend processes,
;; each with its own memory and scheduler footprint, and makes the same problem
;; worse. Pooling keeps a small, warm set of server connections and multiplexes
;; every application connection onto it.
;;
;; Values are placeholders resolved by the entrypoint from environment
;; variables; no credential is stored in this file.

[databases]
;; One logical database. The client connects to "school" on PgBouncer and lands
;; on the real database behind it.
* = host=__DB_HOST__ port=__DB_PORT__ dbname=__DB_NAME__

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction pooling: a server connection is held only for the duration of a
;; transaction, which is what makes a small pool serve a large number of short
;; web requests. It is safe here because the application does not rely on
;; session state across statements:
;;   * `migrate --isolated` locks through Redis, not PostgreSQL advisory locks;
;;   * migrations and CREATE INDEX CONCURRENTLY use the pgsql_direct connection
;;     and bypass this pooler entirely;
;;   * no LISTEN/NOTIFY, no session-level SET, no session advisory locks.
;; Row locks (SELECT ... FOR UPDATE) are transaction-scoped and unaffected.
pool_mode = transaction

;; PgBouncer >= 1.21 tracks protocol-level prepared statements per client and
;; replays them onto whichever server connection it hands out, which is what
;; makes PDO's pdo_pgsql driver safe under transaction pooling.
max_prepared_statements = 200

;; Sizing. max_client_conn is what the application tier may open in total:
;; (web replicas x PM_MAX_CHILDREN) + (worker replicas x 1) + headroom.
;; default_pool_size is how many real PostgreSQL backends that collapses into,
;; and must stay comfortably below the server's max_connections.
max_client_conn = __MAX_CLIENT_CONN__
default_pool_size = __DEFAULT_POOL_SIZE__
min_pool_size = __MIN_POOL_SIZE__
reserve_pool_size = __RESERVE_POOL_SIZE__
reserve_pool_timeout = 3

;; Do not queue a client forever behind an exhausted pool; fail fast so the
;; request errors and is retried rather than holding a php-fpm worker hostage.
query_wait_timeout = 15

;; Recycle server connections so a long-lived backend cannot accumulate state
;; or memory, and drop idle ones back to min_pool_size.
server_lifetime = 1800
server_idle_timeout = 300
client_idle_timeout = 0

;; Health and observability.
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
stats_period = 60

;; Only these users may reach the admin console (SHOW POOLS, etc.).
admin_users = __DB_USER__
stats_users = __DB_USER__
