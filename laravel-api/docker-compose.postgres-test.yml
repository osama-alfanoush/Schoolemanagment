services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_test
      POSTGRES_USER: school_test
      POSTGRES_PASSWORD: school_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_test -d school_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
