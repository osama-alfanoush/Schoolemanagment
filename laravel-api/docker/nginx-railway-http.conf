# Top-level nginx configuration for the single-container Railway "web" role.
#
# Replaces the distribution nginx.conf so the process runs in the foreground
# under supervisord as an unprivileged user, logs to the container's stdout and
# stderr (Railway collects those; a file inside an ephemeral container is lost),
# and never tries to write to a root-owned path.

worker_processes auto;
daemon off;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Combined plus the correlation id the application issues, so an access-log
    # line can be joined to the application log line for the same request.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$upstream_http_x_request_id '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    # Unprivileged user cannot write to /var/cache/nginx.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    # php-fpm listens on loopback inside this container only. keepalive holds
    # connections open so a burst does not pay a new connect per request.
    upstream php_fpm {
        server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    include /etc/nginx/http.d/default.conf;
}
