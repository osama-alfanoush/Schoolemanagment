; Process supervision for the Railway "web" role.
;
; Railway gives a service a single container, and the web role needs two
; processes: php-fpm and the nginx that fronts it. supervisord runs as PID 1 so
; that:
;   * SIGTERM from the platform is translated into a graceful stop of both
;     children (QUIT for both: php-fpm finishes in-flight requests, nginx
;     finishes and closes listeners) instead of an abrupt kill;
;   * if either process dies the container exits rather than silently serving
;     502s or listening with no backend, which lets Railway's restart policy do
;     its job.
;
; Worker and scheduler roles do not use this file — they exec the artisan
; command directly, so the queue worker itself is PID 1 and receives SIGTERM
; straight from the platform for its own graceful shutdown.

[supervisord]
nodaemon=true
user=www-data
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
; Children inherit the container environment, including APP_RELEASE.

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=false
startsecs=2
; QUIT is php-fpm's graceful stop: stop accepting, finish in-flight requests.
stopsignal=QUIT
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=false
startsecs=2
; QUIT is nginx's graceful shutdown.
stopsignal=QUIT
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; Bring the whole container down when either process exits, so the platform
; restarts a known-good instance instead of leaving a half-dead one in the
; load-balancer rotation.
[eventlistener:process-exit]
command=sh -c 'printf "READY\n"; while read -r line; do echo "supervisor: child exited, stopping container: $line" >&2; kill -TERM 1; printf "RESULT 2\nOK"; done'
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
